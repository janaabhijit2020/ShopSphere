services:

  database:
    image: mysql:8.4
    container_name: shopsphere-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shopsphere_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./Backend

    container_name: shopsphere-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mysql://database:3306/shopsphere_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build:
      context: ./shopsphere-frontend

    container_name: shopsphere-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  mysql_data: